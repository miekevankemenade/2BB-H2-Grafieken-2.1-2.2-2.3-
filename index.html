<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grafieken en formules</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --roze: rgb(233,36,213);
  --paars: rgb(94,6,150);
  --cyaan: rgb(69,237,255);
  --tekst: #2a1440;
  --goed: #1a9e5a;
  --fout: #d62828;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Montserrat',sans-serif;background:#faf6fd;color:var(--tekst);font-size:17px;line-height:1.5}
header{background:linear-gradient(90deg,var(--paars),var(--roze));color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
header h1{margin:0;font-size:1.25rem;font-weight:800}
.score{background:#fff;color:var(--paars);border:none;border-radius:999px;padding:8px 16px;font:800 1rem 'Montserrat',sans-serif;cursor:pointer}
main{max-width:860px;margin:0 auto;padding:16px}
.mods{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.mod{flex:1 1 200px;border:2px solid var(--paars);background:#fff;color:var(--paars);border-radius:14px;padding:10px;font:700 .95rem 'Montserrat',sans-serif;cursor:pointer;display:flex;align-items:center;gap:8px;text-align:left}
.mod .nr{background:var(--cyaan);color:var(--paars);border-radius:50%;min-width:30px;height:30px;display:grid;place-items:center;font-weight:800}
.mod.on{background:var(--paars);color:#fff}
.secs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.sec{border:2px solid var(--roze);background:#fff;color:var(--roze);border-radius:999px;padding:7px 14px;font:700 .9rem 'Montserrat',sans-serif;cursor:pointer}
.sec.on{background:var(--roze);color:#fff}
.secinfo{font-weight:700;color:var(--paars);margin:4px 0 8px}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.dot{width:40px;height:40px;border-radius:50%;border:2px solid #cbb8da;background:#fff;color:var(--paars);font:800 .95rem 'Montserrat',sans-serif;cursor:pointer}
.dot.d2{background:var(--roze);border-color:var(--roze);color:#fff}
.dot.d1{background:var(--paars);border-color:var(--paars);color:#fff}
.dot.sk{border-style:dashed;border-color:#999;color:#777}
.dot.bz{border-color:var(--roze)}
.dot.cur{outline:4px solid var(--cyaan);outline-offset:2px}
.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 4px 18px rgba(94,6,150,.10);border-top:6px solid var(--cyaan)}
.qhead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:flex-start}
.qnr{font-weight:800;color:var(--roze);font-size:1.05rem}
.et{font-size:.78rem;background:#e9fdff;border:1px solid var(--cyaan);color:var(--paars);padding:4px 10px;border-radius:12px;max-width:100%}
.lines p{margin:0 0 4px}
.context{background:#f3e9fa;border-left:5px solid var(--paars);padding:10px 12px;border-radius:10px;margin:12px 0}
.qtext{font-weight:700;font-size:1.08rem;margin:12px 0}
h2{color:var(--paars);margin:0 0 10px;font-size:1.3rem}
h3{color:var(--paars);margin:0 0 6px;font-size:1.05rem}
.graph{width:100%;max-width:470px;display:block;margin:8px auto;background:#fff;touch-action:manipulation;user-select:none}
.graph .rl{stroke:#e7dcef;stroke-width:1}
.graph .as{stroke:#3b2352;stroke-width:2}
.graph .pijl{fill:#3b2352}
.graph text{font:600 12px 'Montserrat',sans-serif;fill:#3b2352}
.graph .aslab{font-weight:800;font-size:14px;fill:var(--paars)}
.graph .ln{fill:none;stroke-width:3.5;stroke-linecap:round}
.graph .ln.roze{stroke:rgb(233,36,213)}
.graph .ln.paars{stroke:rgb(94,6,150)}
.graph .ln.dash{stroke:var(--goed);stroke-dasharray:9 6}
.graph .gd{fill:none;stroke:var(--goed);stroke-width:2.5;stroke-dasharray:6 5}
.graph .gdc{fill:none;stroke:var(--goed);stroke-width:3}
.graph .gdt{fill:var(--goed);font-weight:800;font-size:14px;paint-order:stroke;stroke:#fff;stroke-width:4px}
.graph .pt{fill:var(--paars)}
.graph .ptl{fill:var(--paars);font-weight:800;font-size:15px;paint-order:stroke;stroke:#fff;stroke-width:4px}
.graph .u-user{fill:var(--roze)}
.graph .u-right{fill:var(--goed)}
.graph .u-wrong{fill:var(--fout)}
.graph .kruis{stroke:#fff;stroke-width:2.5}
.graph .mis{fill:none;stroke:var(--goed);stroke-width:3;stroke-dasharray:4 3}
.graph .poly{fill:rgba(233,36,213,.15);stroke:var(--roze);stroke-width:2.5}
.graph .ghost{fill:rgba(233,36,213,.35);pointer-events:none}
.graph.klik{cursor:crosshair}
.legend{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;font-weight:700;font-size:.95rem;margin-top:4px}
.legend span{display:flex;align-items:center;gap:6px}
.sw{display:inline-block;width:26px;height:6px;border-radius:3px}
.sw.roze{background:var(--roze)}
.sw.paars{background:var(--paars)}
.antwoord{margin:14px 0;display:flex;flex-direction:column;align-items:center;gap:8px}
.coord{display:flex;align-items:flex-start;gap:6px;font-size:2rem;font-weight:800;color:var(--paars)}
.coord label{display:flex;flex-direction:column;align-items:center}
.coord small{font-size:.85rem}
.haak{line-height:2.4}
input.ant{width:84px;font:800 1.3rem 'Montserrat',sans-serif;text-align:center;border:3px solid var(--paars);border-radius:10px;padding:6px;color:var(--tekst)}
input.ant:focus{outline:3px solid var(--cyaan)}
input.ant.g{border-color:var(--goed);background:#e7f8ef}
input.ant.f{border-color:var(--fout);background:#fdecec}
input.ant.small{width:62px;font-size:1.1rem}
.numrij{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.1rem}
table.tab{border-collapse:collapse;margin:8px auto;font-weight:700}
table.tab th,table.tab td{border:2px solid var(--paars);padding:6px 8px;text-align:center;min-width:52px}
table.tab th{background:var(--paars);color:#fff}
.opts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.opt{font:700 1.05rem 'Montserrat',sans-serif;border:3px solid var(--paars);background:#fff;color:var(--paars);border-radius:12px;padding:10px 18px;cursor:pointer;min-width:90px}
.opt:hover:not(:disabled){background:#f3e9fa}
.opt.g{background:var(--goed);border-color:var(--goed);color:#fff}
.opt.f{background:#fdecec;border-color:var(--fout);color:var(--fout);text-decoration:line-through}
.opt.hint{border-color:var(--goed);box-shadow:0 0 0 4px rgba(26,158,90,.25)}
.tip{font-size:.92rem;color:#5b4470;text-align:center}
.tip p{margin:0}
.knoppen,.navknoppen{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.navknoppen{justify-content:space-between;border-top:2px solid #f0e6f7;padding-top:12px;margin-top:16px}
.btn{font:700 1rem 'Montserrat',sans-serif;border-radius:12px;padding:11px 18px;border:none;cursor:pointer}
.btn:disabled{opacity:.4;cursor:default}
.btn.check{background:var(--roze);color:#fff}
.btn.hint{background:var(--cyaan);color:var(--paars)}
.btn.skip{background:#fff;border:2px solid #bbb;color:#666}
.btn.wis{background:#fff;border:2px solid var(--roze);color:var(--roze);padding:7px 12px;font-size:.9rem}
.btn.nav{background:#fff;border:2px solid var(--paars);color:var(--paars)}
.btn.nav.glow{background:var(--paars);color:#fff}
.btn.groot{background:var(--roze);color:#fff;font-size:1.1rem;display:block;margin:18px auto 0}
.box{border-radius:12px;padding:12px 14px;margin-top:12px}
.box.good{background:#e7f8ef;border-left:6px solid var(--goed)}
.box.bad{background:#fdeaf3;border-left:6px solid var(--roze)}
.box.info{background:#f3e9fa;border-left:6px solid var(--paars)}
.box.hintbox{background:#e9fdff;border-left:6px solid var(--cyaan)}
.box.oplossing{background:#fff7e0;border-left:6px solid #f2b200}
.box b{display:block;margin-bottom:2px}
.uitleg-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media (max-width:700px){.uitleg-grid{grid-template-columns:1fr}}
.ezel{background:var(--cyaan);color:var(--paars);font-weight:800;border-radius:12px;padding:10px 14px;margin-top:12px}
.waarom{background:#f3e9fa;border-radius:12px;padding:12px 14px;margin-top:14px}
.res td,.res th{padding:8px 10px;border-bottom:1px solid #eee;text-align:left}
.res{width:100%;border-collapse:collapse;margin:10px 0}
.res th{color:var(--paars)}
.linkbtn{background:none;border:none;color:var(--roze);font:700 .95rem 'Montserrat',sans-serif;cursor:pointer;text-decoration:underline;padding:2px}
.graph .ln.blauw{stroke:#1d6fd1}
.graph .ln.teal{stroke:#16a394}
.graph .dotf.roze{fill:var(--roze)}
.graph .dotf.blauw{fill:#1d6fd1}
.graph .dotf.paars{fill:var(--paars)}
.graph .zz{fill:none;stroke:#3b2352;stroke-width:2}
.graph .aslab.boek{font-style:italic;font-weight:600;font-size:12px;fill:#3b2352;paint-order:stroke;stroke:#fff;stroke-width:4px}
.graph .tagc.roze{fill:var(--roze)}
.graph .tagc.blauw{fill:#1d6fd1}
.graph .tagc.teal{fill:#16a394}
.graph .tagt{fill:#fff;font-weight:800;font-size:13px}
.graph .tagl{font-weight:800;font-size:13px;paint-order:stroke;stroke:#fff;stroke-width:4px}
.graph .tagl.roze{fill:var(--roze)}
.graph .tagl.blauw{fill:#1d6fd1}
.graph .tagl.teal{fill:#16a394}
.graph .hit{fill:none;stroke:transparent;stroke-width:24;cursor:pointer;pointer-events:stroke}
.graph .hit:hover{stroke:rgba(69,237,255,.35)}
.graph .ln.sel-blauw{stroke:#1d5fd6;stroke-width:7}
.graph .ln.sel-rood{stroke:#e01b1b;stroke-width:7}
.graph .vd{stroke:#3b2352;stroke-width:1.5;stroke-dasharray:4 4}
.graph .note{font-weight:700;font-size:12px;fill:var(--paars);paint-order:stroke;stroke:#fff;stroke-width:6px}
.duo{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.duo .graph{max-width:340px;flex:1 1 280px;margin:0}
.wie{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700;font-size:.9rem}
.wie .naam{background:rgba(255,255,255,.18);border-radius:999px;padding:6px 12px}
.wie .wolk{font-size:.8rem;opacity:.95}
.wie button{background:transparent;border:2px solid #fff;color:#fff;border-radius:999px;padding:5px 12px;font:700 .85rem 'Montserrat',sans-serif;cursor:pointer}
.login{max-width:440px;margin:24px auto}
.login label{display:block;font-weight:700;color:var(--paars);margin:14px 0 4px}
.login input{width:100%;font:700 1.15rem 'Montserrat',sans-serif;border:3px solid var(--paars);border-radius:12px;padding:10px 12px;color:var(--tekst)}
.login input:focus{outline:3px solid var(--cyaan)}
.login input.pin{letter-spacing:.5em;width:170px}
.login .klein{font-size:.85rem;color:#5b4470;margin-top:4px}
.login .btn{width:100%;margin-top:18px;font-size:1.1rem}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--paars);color:#fff;font-weight:700;padding:12px 18px;border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:50;max-width:calc(100% - 32px)}
footer{text-align:center;font-size:.8rem;color:#8a76a0;padding:20px}
</style>
</head>
<body>
<header>
  <h1>📈 Grafieken en formules</h1>
  <div class="wie" id="wie"></div>
  <button class="score" id="score" onclick="go(cur.mod,'result',0)">⭐ 0 punten</button>
</header>
<main id="app"></main>
<footer>Wiskunde VMBO Basis · Algebraïsche verbanden</footer>

<script>
/* ============ EINDTERMEN ============ */
const ET = {
  a: "WI/K/4.3 – coördinaten van punten aflezen en tekenen in een assenstelsel (ook negatief)",
  b: "WI/K/4.3 – twee grafieken vergelijken en het snijpunt vaststellen en uitleggen",
  c: "WI/K/4.1 en 4.5 – bij een formule een tabel maken, y berekenen en de grafiek tekenen",
  d: "WI/K/4.3 – het verloop van een grafiek beschrijven (stijgend, dalend, gelijk) en zien hoe steil een grafiek is",
  e: "WI/K/4.3 – twee grafieken vergelijken, de verschillen uitleggen en het snijpunt vaststellen",
  f: "WI/K/4.3 en 4.5 – waarden aflezen uit een grafiek en controleren met de woordformule",
  teken: "WI/K/4.3 – in een gegeven assenstelsel een grafiek tekenen bij een tabel",
  tabel: "WI/K/4.1 – bij een woordformule een tabel maken"
};

/* ============ ASSENSTELSELS ============ */
const G = {xmin:-6,xmax:6,ymin:-6,ymax:6};
const FIETS = {xmin:0,xmax:6,ymin:0,ymax:24,ystep:2,xlabel:"uren",ylabel:"euro",
  lines:[{f:x=>2*x+4,kl:'roze',naam:'Fietsverhuur A'},{f:x=>4*x,kl:'paars',naam:'Fietsverhuur B'}]};
const TEMP = {xmin:0,xmax:8,ymin:-6,ymax:6,xlabel:"uur",ylabel:"°C",
  lines:[{f:x=>x-4,kl:'roze',naam:'Stad Noord'},{f:x=>2-x/2,kl:'paars',naam:'Stad Zuid'}]};
const TAXI = {xmin:0,xmax:6,ymin:0,ymax:20,ystep:2,xlabel:"km",ylabel:"euro",
  lines:[{f:x=>3*x+2,kl:'roze',naam:'Taxi Rood'},{f:x=>x+6,kl:'paars',naam:'Taxi Blauw'}]};
const VRIES = {xmin:0,xmax:6,ymin:-8,ymax:6,xlabel:"uur",ylabel:"°C"};

const FIETS_CTX = ["Je wilt een fiets huren.","De grafiek laat zien wat het kost bij twee bedrijven."];
const TEMP_CTX = ["Het is een koude nacht.","De grafiek laat de temperatuur zien in twee steden.","Om 0 uur is het middernacht."];
const TAXI_CTX = ["Je neemt een taxi.","Er zijn twee taxibedrijven.","De grafiek laat zien wat een rit kost."];

/* ============ GRAFIEKEN UIT HOOFDSTUK 2 ============ */
// 2.1 opdracht 1: temperatuur van Nard
function tempF(x){
  if(x<=9.5) return 2.2*(x-7);
  if(x<=10) return 5.5+0.5*Math.sin((x-9.5)/0.5*Math.PI/2);
  if(x<=11.75) return 6;
  if(x<=12.25){ const t=x-11.75; return 6-6*t*t; }
  if(x<=13) return -6*(x-13);
  if(x<=14) return -3+3*(14-x)*(14-x);
  if(x<=15){ const t=x-14; return -3+0.857*t*t; }
  if(x<=16.33) return -2.143+1.714*(x-15);
  if(x<=17.33){ const t=x-16.33; return 0.137+1.72*t-0.857*t*t; }
  return 1;
}
const TEMP21 = {boek:true,xmin:7,xmax:19,ymin:-3,ymax:6,xzaag:true,cw:30,ch:28,xlabel:'tijd in uren →',ylabel:'temperatuur in °C →',lines:[{f:tempF,kl:'roze'}]};
const TEMP21_SEGS = [{from:7,to:10},{from:10,to:11.75},{from:11.75,to:14},{from:14,to:17.33},{from:17.33,to:19}];
const TEMP21_CTX = ['Nard heeft op één dag de temperatuur opgeschreven.','Hij deed dat van 7:00 uur tot 19:00 uur.','De grafiek hoort bij zijn metingen.'];

// 2.1 voorbeeld + opdracht 2: winst
const WINST_P = [[0,280],[2,240],[4,80],[6,80],[6.25,96],[6.5,124],[6.75,148],[7,160],[10,200]];
const WINST = {boek:true,xmin:0,xmax:10,ymin:0,ymax:280,ystep:40,cw:36,ch:32,xlabel:'tijd in jaren →',ylabel:'winst in miljoenen →',lines:[{pts:WINST_P,kl:'roze'}]};
const WINST_SEGS = [{pts:WINST_P.slice(0,2)},{pts:WINST_P.slice(1,3)},{pts:WINST_P.slice(2,4)},{pts:WINST_P.slice(3,8)},{pts:WINST_P.slice(7,9)}];
const WINST_CTX = ['De grafiek laat de winst van een bedrijf zien.','Winst is het geld dat een bedrijf overhoudt.'];

// 2.1 opdracht 3: Carla duikt
const CARLA_P = [[0,0],[5,-20],[10,-30],[15,-30],[20,-15],[25,-5],[30,0]];
const CARLA = {boek:true,xmin:0,xmax:30,xstep:5,ymin:-30,ymax:5,ystep:5,cw:50,ch:30,xlabel:'aantal minuten →',ylabel:'diepte in meters →'};
const CARLA_L = Object.assign({},CARLA,{lines:[{pts:CARLA_P,kl:'roze',dots:true}]});
const CARLA_SEGS = CARLA_P.slice(0,-1).map((p,i)=>({pts:[p,CARLA_P[i+1]]}));
const CARLA_CTX = ['Carla doet aan diepzeeduiken.','In de tabel zie je hoe diep ze zwemt tijdens een duik.'];
const CARLA_TAB = {lx:'aantal minuten',ly:'diepte in meters',xs:CARLA_P.map(p=>p[0]),ys:CARLA_P.map(p=>p[1])};

// 2.1 opdracht 4: Jolanda
const JOL_P = [[0,500],[1,460],[2,250],[3,250],[4,320],[5,350],[6,350]];
const JOLANDA = {boek:true,xmin:0,xmax:6,ymin:200,ymax:500,ystep:50,yzaag:true,cw:52,ch:32,xlabel:'aantal dagen vakantie →',ylabel:"bedrag in euro's →",lines:[{pts:JOL_P,kl:'roze',dots:true}]};
const JOL_CTX = ['Jolanda houdt in de vakantie bij hoeveel euro er op haar bankrekening staat.','Je ziet de resultaten in de tabel en in de grafiek.'];
const JOL_TAB = {lx:'aantal dagen vakantie',ly:"bedrag in euro's",xs:JOL_P.map(p=>p[0]),ys:JOL_P.map(p=>p[1])};

// 2.1 leerdoelen: Ingrid
const INGRID = {boek:true,xmin:0,xmax:10,ymin:0,ymax:14,ystep:2,cw:36,ch:28,xlabel:'tijd in kwartieren →',ylabel:'afstand in km →',lines:[{pts:[[0,0],[4,8],[5,9.2],[6,9.9],[7,10.5],[9.5,14]],kl:'roze'}]};

// 2.1 O3: dolfijn
const DOLFIJN = {boek:true,xmin:0,xmax:30,xstep:5,ymin:-20,ymax:8,ystep:4,cw:50,ch:30,xlabel:'tijd in seconden →',ylabel:'hoogte in meters →',lines:[{pts:[[0,-12],[5,-8],[10,0],[15,6],[20,-6],[25,-12],[30,-20]],kl:'roze',smooth:true,dots:true}]};

// 2.2 opdracht 5/6: Flixbus en auto
const RIA_P = [[7,0],[9.5,250],[10.25,330],[10.5,330],[12,500]];
const BUS_P = [[6,0],[9,250],[9.75,250],[11,350],[11.5,350],[13,500]];
const FLIX = {boek:true,xmin:6,xmax:13,ymin:0,ymax:500,ystep:100,xzaag:true,xrot:true,xfmt:tijd,cw:34,ch:34,xlabel:'tijd in uren →',ylabel:'afstand in km →'};
const RIA_L = {pts:RIA_P,kl:'roze',tag:{x:12,y:535,t:'1',rond:true}};
const BUS_L = {pts:BUS_P,kl:'blauw',tag:{x:13,y:535,t:'2',rond:true}};
const FLIX1 = Object.assign({},FLIX,{lines:[RIA_L]});
const FLIX2 = Object.assign({},FLIX,{lines:[BUS_L]});
const FLIXB = Object.assign({},FLIX,{lines:[RIA_L,BUS_L]});
const FLIX_CTX = ['Wout gaat met de Flixbus van Amsterdam naar Parijs.','De bus stopt onderweg twee keer.','Ria gaat met de auto van Amsterdam naar Parijs.'];

// 2.2 voorbeeld + opdracht 7: Jan en Alex
const JANALEX = {boek:true,xmin:0,xmax:60,xstep:15,ymin:0,ymax:35,ystep:5,cw:80,ch:28,xlabel:'tijd in minuten →',ylabel:'afstand in km →',
  lines:[{pts:[[0,0],[15,10],[30,19],[45,25],[60,27]],kl:'blauw',smooth:true,tag:{x:31,y:23,t:'Alex',a:'end'}},
         {pts:[[0,0],[15,4],[30,13],[45,25],[60,33]],kl:'roze',smooth:true,tag:{x:36,y:15,t:'Jan',a:'start'}}]};
const JANALEX_CTX = ['Je ziet de grafieken van twee fietsers: Jan en Alex.'];

// 2.2 opdracht 8: Ger en Rina
const GERRINA = {boek:true,xmin:0,xmax:20,ymin:0,ymax:4,ystep:0.5,xzaag:true,xevery:4,yevery:2,cw:18,ch:32,xfmt:v=>'8:'+String(v).padStart(2,'0'),xlabel:'tijd in uren →',ylabel:'afstand in km →',
  lines:[{pts:[[0,0],[4,0.9],[8,1.5],[12,2.1],[16,3],[18,4]],kl:'teal',smooth:true,tag:{x:18.8,y:3.3,t:'A',rond:true}},
         {pts:[[4,0],[6,1],[7,1],[8,1.5],[10,2.5],[12,2.5],[13,3.5],[14,3.5],[15,4]],kl:'roze',tag:{x:11.6,y:3.3,t:'B',rond:true}}]};

/* ============ HULPFUNCTIES VOOR VRAGEN ============ */
function hk(n){return Math.abs(n)===1?'hokje':'hokjes';}
function walk(x,y,lab){
  return [
    'Start in de oorsprong (0, 0).',
    x===0?'Je gaat niet naar links of rechts. Dus x = 0.':`Ga ${Math.abs(x)} ${hk(x)} naar ${x<0?'links':'rechts'}. Dus x = ${x}.`,
    y===0?'Je gaat niet omhoog of omlaag. Dus y = 0.':`Ga dan ${Math.abs(y)} ${hk(y)} ${y<0?'omlaag':'omhoog'}. Dus y = ${y}.`,
    `Punt ${lab} is (${x}, ${y}).`
  ];
}
// Punt aflezen
function R(x,y,lab,extra){
  return Object.assign({
    type:'read', cfg:G, pt:{x,y,label:lab}, ans:{x,y},
    text:[`Kijk naar punt ${lab}.`,`Wat zijn de coördinaten van punt ${lab}?`],
    hints:[
      'Begin in het midden. Dat is de oorsprong (0, 0).',
      x===0?`Punt ${lab} ligt precies op de y-as. Hoeveel hokjes ga je dan opzij?`
           :`Ligt punt ${lab} links of rechts van de y-as? ${x<0?'Links betekent: x krijgt een min (-).':'Rechts betekent: x is een gewoon getal (plus).'} Tel de hokjes opzij.`,
      y===0?`Punt ${lab} ligt precies op de x-as. Hoeveel hokjes ga je dan omhoog of omlaag?`
           :`Ligt punt ${lab} boven of onder de x-as? ${y<0?'Onder betekent: y krijgt een min (-).':'Boven betekent: y is een gewoon getal (plus).'} Tel de hokjes omhoog of omlaag.`
    ],
    explain: walk(x,y,lab)
  }, extra||{});
}
// Eén punt tekenen
function P1(x,y,lab,extra){
  return Object.assign({
    type:'plot', cfg:G, targets:[{x,y,label:lab}],
    text:[`Teken punt ${lab}(${x}, ${y}).`,'Klik op de juiste plek in het assenstelsel.'],
    hints:[
      'Begin in de oorsprong (0, 0).',
      x===0?'x = 0: je gaat niet opzij.':`x = ${x}: ga ${Math.abs(x)} ${hk(x)} naar ${x<0?'links':'rechts'}.`,
      y===0?'y = 0: je blijft op de x-as. Klik daar.':`y = ${y}: ga ${Math.abs(y)} ${hk(y)} ${y<0?'omlaag':'omhoog'}. Klik daar.`
    ],
    explain: walk(x,y,lab).concat(['Het groene rondje laat zien waar het punt moet staan.'])
  }, extra||{});
}
// Tabel invullen bij formule
function T(form,f,xs,show,hint3,extra){
  return Object.assign({
    type:'table', form, f, xs, show,
    text:[`Maak de tabel af bij de formule ${form}.`,'Reken bij elke x de y uit.'],
    hints:['Kijk naar de eerste x in de tabel.','Zet dat getal op de plek van x in de formule. Reken dan uit.',hint3],
    explain:[`Vul elke x in de formule ${form} in.`].concat(xs.map(x=>`x = ${x} → y = ${show(x)}`))
  }, extra||{});
}
// Punten uit tabel tekenen
function PT(form,f,xs,extra){
  const t = xs.map(x=>({x,y:f(x)}));
  return Object.assign({
    type:'plot', cfg:G, targets:t, f, tabel:{xs,f},
    text:[`Hier zie je de tabel bij de formule ${form}.`,'Teken alle punten uit de tabel in het assenstelsel.'],
    hints:[`Het eerste punt is (${xs[0]}, ${f(xs[0])}).`,'Bij elke kolom van de tabel hoort één punt: (x, y).',`Je moet ${xs.length} punten tekenen.`],
    explain:['De punten zijn: '+t.map(p=>`(${p.x}, ${p.y})`).join(', ')+'.','De groene rondjes laten zien waar ze moeten staan.','Rode punten staan op de verkeerde plek. Klik erop om ze weg te halen.']
  }, extra||{});
}

function lokaalSleutel(){ return LL ? OPSLAG + '|' + LL.klascode + '|' + LL.naam.toLowerCase() : OPSLAG; }
function leesLokaal(){ try{ return JSON.parse(localStorage.getItem(lokaalSleutel())||'null'); }catch(e){ return null; } }
function zetStaat(d){
  S = (d && d.S) || {};
  cur = (d && d.cur && MODS[d.cur.mod]) ? d.cur : {mod:0, sec:'uitleg', i:0};
  if(cur.sec!=='uitleg' && cur.sec!=='result' && !qlist(cur.mod,cur.sec)[cur.i]) cur = {mod:cur.mod, sec:'uitleg', i:0};
}
if(!ONLINE) zetStaat(leesLokaal());

function bewaar(){
  try{ localStorage.setItem(lokaalSleutel(), JSON.stringify({S,cur,t:Date.now()})); }catch(e){}

}

async function rpc(fn, body, keepalive){
  const r = await fetch(SUPABASE_URL.replace(/\/+$/,'') + '/rest/v1/rpc/' + fn, {
    method:'POST', keepalive:!!keepalive,
    headers:{'Content-Type':'application/json', apikey:SUPABASE_KEY},
    body:JSON.stringify(body)
  });
  if(!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

// Korte samenvatting voor het docentoverzicht
function totaalPunten(){ let t=0; for(const k in S) t+=S[k].pts||0; return t; }
function maxPunten(){ return MODS.reduce((a,M)=>a+(M.opdr.length+M.toets.length)*2,0); }
function samenvatting(){
  const vragen={};
  MODS.forEach((M,m)=>['opdr','toets'].forEach(sec=>qlist(m,sec).forEach((q,i)=>{
    const k=key(m,sec,i), t=S[k];
    if(t && (t.done||t.tries||t.hint||t.skipped)) vragen[k]={p:t.pts||0,f:t.tries||0,h:t.hint||0,d:t.done?1:0,o:t.skipped?1:0,z:t.shown?1:0};
  })));
  return {v:1, titel:APP_TITEL, modules:MODS.map(M=>({naam:M.kort, opdr:M.opdr.length, toets:M.toets.length})), vragen};
}

async function wolkOpslaan(keepalive){
  if(!ONLINE || !LL || !wolk.vies) return;
  if(wolk.bezig){ clearTimeout(wolk.timer); wolk.timer=setTimeout(wolkOpslaan,1000); return; }
  wolk.bezig = true; wolk.vies = false; zetWolk('opslaan');
  const body = {p_app:APP_ID, p_klascode:LL.klascode, p_naam:LL.naam, p_pin:LL.pin,
    p_staat:{S,cur,t:Date.now()}, p_samenvatting:samenvatting(), p_punten:totaalPunten(), p_max:maxPunten()};
  try{
    const r = await rpc('leerling_opslaan', body, keepalive && JSON.stringify(body).length < 60000);
    if(r && r.ok){ zetWolk('ok'); clearTimeout(wolk.opnieuw); }
    else if(r && r.fout==='pincode'){ wolk.bezig=false; uitloggen(true); toast('Je pincode is veranderd door je docent. Meld je opnieuw aan.'); return; }
    else throw new Error(r && r.fout);
  }catch(e){
    wolk.vies = true; zetWolk('fout');
    clearTimeout(wolk.opnieuw); wolk.opnieuw = setTimeout(wolkOpslaan, 15000);
  }
  wolk.bezig = false;
}

}

}

async function aanmelden(klascode, naam, pin, stil){
  klascode = String(klascode||'').replace(/\s/g,'').toUpperCase();
  naam = String(naam||'').trim().replace(/\s+/g,' ');
  pin = String(pin||'').trim();
  if(!klascode){ LOGINFOUT='Vul de klascode in.'; return render(); }
  if(naam.length<2){ LOGINFOUT='Vul je voornaam en achternaam in.'; return render(); }
  if(!/^[0-9]{4}$/.test(pin)){ LOGINFOUT='Een pincode is 4 cijfers.'; return render(); }
  LADEN = true; LOGINFOUT=''; render();
  let r;
  try{ r = await rpc('leerling_aanmelden', {p_app:APP_ID, p_klascode:klascode, p_naam:naam, p_pin:pin}); }
  catch(e){ LADEN=false; LOGINFOUT='Er is geen verbinding. Controleer het internet en probeer het opnieuw.'; return render(); }
  LADEN = false;
  if(!r || !r.ok){
    const f = r && r.fout;
    LOGINFOUT = f==='klascode' ? 'Deze klascode bestaat niet. Vraag je docent om de goede code.'
      : f==='pincode' ? 'De pincode klopt niet. Is dit wel jouw naam? Heeft een klasgenoot dezelfde naam? Zet dan je achternaam erbij. Pincode vergeten? Vraag je docent om hem te resetten.'
      : f==='naam' ? 'Vul je voornaam en achternaam in.'
      : f==='pin' ? 'Een pincode is 4 cijfers.' : 'Aanmelden lukte niet. Probeer het opnieuw.';
    if(stil){ LOGINFOUT=''; try{ sessionStorage.removeItem(SESSIE); }catch(e){} }
    return render();
  }
  LL = {klascode, naam:r.naam, pin, klas:r.klas};
  try{ sessionStorage.setItem(SESSIE, JSON.stringify({klascode, naam, pin})); }catch(e){}
  // Neem de nieuwste versie: van de server of van deze computer
  const server = r.staat || {}, lokaal = leesLokaal();
  const nieuwste = (lokaal && lokaal.S && (lokaal.t||0) > (server.t||0)) ? lokaal : server;
  zetStaat(nieuwste);
  wolk.status = 'ok';
  if(nieuwste === lokaal && lokaal) wolk.vies = true;
  render();
  if(wolk.vies) wolkOpslaan();
  if(!stil) toast(r.nieuw ? `Welkom, ${r.naam}! Je punten worden nu bewaard.` : `Welkom terug, ${r.naam}! Je gaat verder waar je was.`);
}

}

  const ml=boek?64:40, mr=boek?26:40, mt=boek?30:40, mb=boek?(c.xrot?78:56):40;
  const nx=Math.round((c.xmax-c.xmin)/xs), ny=Math.round((c.ymax-c.ymin)/ys);
  const zx=c.xzaag?Math.max(cw,26):0, zy=c.yzaag?Math.max(ch,26):0;
  return {xs,ys,cw,ch,ml,mt,nx,ny,zx,zy,W:ml+zx+nx*cw+mr,H:mt+ny*ch+zy+mb,
    X:x=>ml+zx+(x-c.xmin)/xs*cw, Y:y=>mt+(c.ymax-y)/ys*ch};
}
function curveD(pts,g,smooth){
  const p=pts.map(([x,y])=>[g.X(x),g.Y(y)]), r=v=>v.toFixed(1);
  let d='M'+r(p[0][0])+','+r(p[0][1]);
  for(let i=0;i<p.length-1;i++){
    if(!smooth){ d+='L'+r(p[i+1][0])+','+r(p[i+1][1]); continue; }
    const p0=p[i-1]||p[i], p1=p[i], p2=p[i+1], p3=p[i+2]||p2, t=1/6;
    d+=`C${r(p1[0]+(p2[0]-p0[0])*t)},${r(p1[1]+(p2[1]-p0[1])*t)} ${r(p2[0]-(p3[0]-p1[0])*t)},${r(p2[1]-(p3[1]-p1[1])*t)} ${r(p2[0])},${r(p2[1])}`;
  }
  return d;
}
function funD(f,a,b,g){ let d=''; const n=200; for(let k=0;k<=n;k++){ const x=a+(b-a)*k/n; d+=(k?'L':'M')+g.X(x).toFixed(1)+','+g.Y(f(x)).toFixed(1); } return d; }
function pathF(f,c,g,cls,id){ return `<path class="${cls}" d="${funD(f,c.xmin,c.xmax,g)}" clip-path="url(#${id})"/>`; }
function lijnD(l,c,g){ return l.f ? funD(l.f, l.from!=null?l.from:c.xmin, l.to!=null?l.to:c.xmax, g) : curveD(l.pts,g,l.smooth); }
function segD(seg,line,g){ return seg.from!=null ? funD(line.f,seg.from,seg.to,g) : curveD(seg.pts,g,line.smooth); }
function segMid(seg,line){
  if(seg.from!=null){ const x=(seg.from+seg.to)/2; return {x,y:line.f(x)}; }
  const p=seg.pts, a=p[0], b=p[p.length-1]; return {x:(a[0]+b[0])/2,y:(a[1]+b[1])/2};
}
function zigH(x,y){ return `<rect x="${x-11}" y="${y-8}" width="22" height="16" fill="#fff"/><path class="zz" d="M${x-10},${y} l3,-6 l6,12 l6,-12 l3,6"/>`; }
function zigV(x,y){ return `<rect x="${x-8}" y="${y-11}" width="16" height="22" fill="#fff"/><path class="zz" d="M${x},${y+10} l-6,-3 l12,-6 l-12,-6 l6,-3"/>`; }
function tagSvg(t,kl,X,Y){
  const x=X(t.x), y=Y(t.y);
  if(t.rond) return `<circle class="tagc ${kl}" cx="${x}" cy="${y}" r="10"/><text class="tagt" x="${x}" y="${y+4.5}" text-anchor="middle">${t.t}</text>`;
  return `<text class="tagl ${kl}" x="${x}" y="${y}" text-anchor="${t.a||'middle'}">${t.t}</text>`;
}
function svgGraph(c,ex){
  ex=ex||{}; const g=geom(c), X=g.X, Y=g.Y, id='clip'+(++UID);
  const L=X(c.xmin), Rr=X(c.xmax), Tp=Y(c.ymax), B=Y(c.ymin);
  const ay = c.yzaag ? B+g.zy : ((c.ymin<=0&&c.ymax>=0)?Y(0):B);
  const ax = c.xzaag ? L-g.zx : ((c.xmin<=0&&c.xmax>=0)?X(0):L);
  const yBot = c.yzaag ? ay : B, xLeft = c.xzaag ? ax : L;
  const xf=v=>c.xfmt?c.xfmt(v):fmtN(v);
  const both = !c.xzaag && !c.yzaag && c.xmin<=0&&c.xmax>=0&&c.ymin<=0&&c.ymax>=0;
  let s=`<svg class="graph${ex.klik?' klik':''}" viewBox="0 0 ${g.W} ${g.H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="assenstelsel">`;
  s+=`<defs><clipPath id="${id}"><rect x="${L}" y="${Tp}" width="${Rr-L}" height="${B-Tp}"/></clipPath></defs>`;
  for(let i=0;i<=g.nx;i++){ const x=L+i*g.cw; s+=`<line class="rl" x1="${x}" y1="${Tp}" x2="${x}" y2="${B}"/>`; }
  for(let j=0;j<=g.ny;j++){ const y=Tp+j*g.ch; s+=`<line class="rl" x1="${L}" y1="${y}" x2="${Rr}" y2="${y}"/>`; }
  s+=`<line class="as" x1="${xLeft}" y1="${ay}" x2="${Rr+14}" y2="${ay}"/><polygon class="pijl" points="${Rr+22},${ay} ${Rr+12},${ay-5} ${Rr+12},${ay+5}"/>`;
  s+=`<line class="as" x1="${ax}" y1="${yBot}" x2="${ax}" y2="${Tp-14}"/><polygon class="pijl" points="${ax},${Tp-22} ${ax-5},${Tp-12} ${ax+5},${Tp-12}"/>`;
  if(c.xzaag) s+=zigH(ax+g.zx*0.45,ay);
  if(c.yzaag) s+=zigV(ax,ay-g.zy*0.5);
  if(c.boek){
    s+=`<text class="aslab boek" x="${Rr+18}" y="${ay+(c.xrot?62:36)}" text-anchor="end">${c.xlabel||''}</text>`;
    const xl=Math.max(12,ax-46), ym=(Tp+yBot)/2;
    s+=`<text class="aslab boek" x="${xl}" y="${ym}" text-anchor="middle" transform="rotate(-90 ${xl} ${ym})">${c.ylabel||''}</text>`;
  } else {
    s+=`<text class="aslab" x="${g.W-4}" y="${ay-8}" text-anchor="end">${c.xlabel||'x'}</text>`;
    s+=`<text class="aslab" x="${ax+10}" y="${Tp-12}">${c.ylabel||'y'}</text>`;
  }
  for(let i=0;i<=g.nx;i++){
    if(i%(c.xevery||1)) continue;
    const v=+(c.xmin+i*g.xs).toFixed(4); if(both&&v===0) continue;
    if(c.xrot) s+=`<text x="${X(v)+4}" y="${ay+8}" text-anchor="end" transform="rotate(-90 ${X(v)+4} ${ay+8})">${xf(v)}</text>`;
    else s+=`<text x="${X(v)}" y="${ay+17}" text-anchor="middle">${xf(v)}</text>`;
  }
  for(let j=0;j<=g.ny;j++){
    if(j%(c.yevery||1)) continue;
    const v=+(c.ymin+j*g.ys).toFixed(4); if(both&&v===0) continue;
    s+=`<text x="${ax-6}" y="${Y(v)+4}" text-anchor="end">${fmtN(v)}</text>`;
  }
  if(both) s+=`<text x="${ax-6}" y="${ay+17}" text-anchor="end">0</text>`;
  if(c.xzaag && !(c.ymin<=0&&c.ymax>=0)) s+=`<text x="${ax}" y="${ay+17}" text-anchor="middle">0</text>`;
  if(c.yzaag && c.xmin!==0) s+=`<text x="${ax-6}" y="${ay+4}" text-anchor="end">0</text>`;
  (ex.vdash||[]).forEach(p=>{ s+=`<line class="vd" x1="${X(p.x)}" y1="${ay}" x2="${X(p.x)}" y2="${Y(p.y)}"/>`; });
  (c.lines||[]).forEach(l=>{
    s+=`<path class="ln ${l.kl}" d="${lijnD(l,c,g)}" clip-path="url(#${id})"/>`;
    if(l.dots&&l.pts) l.pts.forEach(p=>{ s+=`<circle class="dotf ${l.kl}" cx="${X(p[0])}" cy="${Y(p[1])}" r="3.5"/>`; });
    if(l.tag) s+=tagSvg(l.tag,l.kl,X,Y);
  });
  if(ex.lineSolid) s+=pathF(ex.lineSolid.f,c,g,'ln paars',id);
  if(ex.lineDash) s+=pathF(ex.lineDash.f,c,g,'ln dash',id);
  if(ex.polyline) s+=`<path class="ln ${ex.polyline.kl}" d="${curveD(ex.polyline.pts,g,false)}" clip-path="url(#${id})"/>`;
  if(ex.poly && ex.poly.length>2) s+=`<polygon class="poly" points="${ex.poly.map(p=>X(p.x)+','+Y(p.y)).join(' ')}"/>`;
  if(ex.color){
    const C=ex.color;
    C.segs.forEach((sg,i)=>{
      const d=segD(sg,C.line,g);
      if(C.sel.includes(i)) s+=`<path class="ln sel-${C.kleur}" d="${d}"/>`;
      if(C.shown && C.target.includes(i) && !C.sel.includes(i)) s+=`<path class="ln dash" d="${d}"/>`;
      if(C.shown && C.sel.includes(i) && !C.target.includes(i)){
        const m=segMid(sg,C.line), px=X(m.x), py=Y(m.y);
        s+=`<circle class="u-wrong" cx="${px}" cy="${py}" r="9"/><path class="kruis" d="M${px-4},${py-4} L${px+4},${py+4} M${px+4},${py-4} L${px-4},${py+4}"/>`;
      }
    });
    if(C.klik) C.segs.forEach((sg,i)=>{ s+=`<path class="hit" data-seg="${i}" d="${segD(sg,C.line,g)}"/>`; });
  }
  (ex.guides||[]).forEach(p=>{
    const px=X(p.x), py=Y(p.y);
    s+=`<path class="gd" d="M${px},${ay} L${px},${py} L${ax},${py}"/><circle class="gdc" cx="${px}" cy="${py}" r="8"/>`;
    const rechts = px > g.W-110;
    s+=`<text class="gdt" x="${rechts?px-12:px+12}" y="${py-12+(p.dy||0)}" text-anchor="${rechts?'end':'start'}">${p.t||'('+xf(p.x)+', '+fmtN(p.y)+')'}</text>`;
  });
  (ex.notes||[]).forEach(n=>{ s+=`<text class="note" x="${X(n.x)+(n.dx||0)}" y="${Y(n.y)+(n.dy||0)}" text-anchor="${n.a||'middle'}">${n.t}</text>`; });
  (ex.missing||[]).forEach(p=>{ s+=`<circle class="mis" cx="${X(p.x)}" cy="${Y(p.y)}" r="10"/>`; });
  (ex.points||[]).forEach(p=>{
    s+=`<circle class="pt" cx="${X(p.x)}" cy="${Y(p.y)}" r="6"/>`;
    if(p.label) s+=`<text class="ptl" x="${X(p.x)+9}" y="${Y(p.y)-9}">${p.label}</text>`;
  });
  (ex.user||[]).forEach(p=>{
    const px=X(p.x), py=Y(p.y);
    s+=`<circle class="u-${p.kl}" cx="${px}" cy="${py}" r="7"/>`;
    if(p.kl==='wrong') s+=`<path class="kruis" d="M${px-4},${py-4} L${px+4},${py+4} M${px+4},${py-4} L${px-4},${py+4}"/>`;
  });
  (ex.labels||[]).forEach(p=>{ s+=`<text class="ptl" x="${X(p.x)+9}" y="${Y(p.y)-9}">${p.label}</text>`; });
  if(ex.klik) s+=`<circle class="ghost" r="8" cx="-50" cy="-50"/>`;
  return s+'</svg>';
}
function legend(c){
  const ls=((c&&c.lines)||[]).filter(l=>l.naam);
  if(!ls.length) return '';
  return `<div class="legend">${ls.map(l=>`<span><i class="sw ${l.kl}"></i>${l.naam}</span>`).join('')}</div>`;
}
function tabelHTML(xs,f,lx,ly){
  return `<table class="tab"><tr><th>${lx||'x'}</th>${xs.map(x=>`<td>${fmtN(x)}</td>`).join('')}</tr><tr><th>${ly||'y'}</th>${xs.map(x=>`<td>${fmtN(f(x))}</td>`).join('')}</tr></table>`;
}
function tabelRows(r){
  return `<table class="tab"><tr><th>${r.lx}</th>${r.xs.map(v=>`<td>${fmtN(v)}</td>`).join('')}</tr><tr><th>${r.ly}</th>${r.ys.map(v=>`<td>${fmtN(v)}</td>`).join('')}</tr></table>`;
}

/* ============ EXTRA'S IN DE GRAFIEK PER VRAAG ============ */
function has(arr,p,tol){ tol=tol||0; return arr.some(a=>Math.abs(a.x-p.x)<1e-9&&Math.abs(a.y-p.y)<=tol+1e-9); }
function exFor(q,s){
  const ex={points:[],user:[],guides:[],missing:[],labels:[]};
  const help = s.shown || s.done;
  if(q.pt) ex.points.push(q.pt);
  if(q.pts) ex.points.push(...q.pts);
  if(q.type==='read' && help) ex.guides.push(q.ans);
  if((q.type==='num'||q.type==='mc') && help && q.guides) ex.guides.push(...q.guides);
  if(q.type==='plot'){
    const tol=q.tol||0;
    s.placed.forEach(p=>ex.user.push({x:p.x,y:p.y,kl:s.done?'right':s.shown?(has(q.targets,p,tol)?'right':'wrong'):'user'}));
    if(s.shown && !s.done){
      q.targets.filter(t=>!has(s.placed,t,tol)).forEach(t=>ex.missing.push(t));
      if(q.targets.length===1) ex.guides.push(q.targets[0]);
    }
    if(s.done){
      q.targets.forEach(t=>{ if(t.label) ex.labels.push(t); });
      if(q.connect) ex.poly=q.targets;
      if(q.f) ex.lineSolid={f:q.f};
      if(q.joinPts) ex.polyline={pts:q.targets.slice().sort((a,b)=>a.x-b.x).map(t=>[t.x,t.y]),kl:q.joinKl||'paars'};
    }
    ex.klik = !s.done;
  }
  if(q.type==='plotLine'){
    const on=p=>Math.abs(q.f(p.x)-p.y)<1e-9;
    s.placed.forEach(p=>ex.user.push({x:p.x,y:p.y,kl:s.done?'right':s.shown?(on(p)?'right':'wrong'):'user'}));
    if(s.done) ex.lineSolid={f:q.f}; else if(s.shown) ex.lineDash={f:q.f};
    ex.klik = !s.done;
  }
  if(q.type==='color'){
    ex.color={line:q.cfg.lines[q.lineIdx||0],segs:q.segs,sel:s.done?q.target:(s.sel||[]),kleur:q.kleur,target:q.target,shown:s.shown&&!s.done,klik:!s.done};
  }
  return ex;
}

function render(){

  document.getElementById('score').style.display='';
  let h='';

  if(cur.sec!=='result'){

function renderUitleg(){
  const M=MODS[cur.mod], U=M.uitleg;
  let h=`<article class="card"><h2>${U.titel}</h2><div class="uitleg-grid"><div class="lines">${lines(U.lines)}<div class="ezel">${lines([U.ezel])}</div></div><div>`;
  if(U.tabel) h+=tabelHTML(U.tabel.xs,U.tabel.f);
  h+=svgGraph(U.graph.cfg,U.graph.ex)+legend(U.graph.cfg);
  h+=`<div class="lines tip" style="text-align:left;margin-top:6px">${lines(U.caption)}</div></div></div>`;
  h+=`<div class="waarom lines"><h3>💼 Waar heb je dit nodig?</h3>${lines(U.waarom)}</div>`;
  h+=`<p class="tip" style="margin-top:10px">🎯 Eindterm: ${M.et}</p>`;
  h+=`<button class="btn groot" onclick="go(${cur.mod},'opdr',0)">Start de opdrachten →</button></article>`;
  return h;
}

function secPunten(m,s){ return qlist(m,s).reduce((a,_,i)=>a+((S[key(m,s,i)]||{}).pts||0),0); }

function renderVraag(){
  const L=qlist(), q=curQ(), s=st(key());
  let h=`<div class="secinfo">${cur.sec==='toets'?'Mini-toets':'Opdrachten'}: ${secPunten(cur.mod,cur.sec)} van ${L.length*2} punten</div>`;
  h+='<div class="dots">'+L.map((_,i)=>{
    const t=S[key(cur.mod,cur.sec,i)]; let cl='';
    if(t){ if(t.done) cl=t.pts===2?'d2':'d1'; else if(t.skipped) cl='sk'; else if(t.tries) cl='bz'; }
    return `<button class="dot ${cl}${i===cur.i?' cur':''}" onclick="go(${cur.mod},'${cur.sec}',${i})" aria-label="vraag ${i+1}">${i+1}</button>`;
  }).join('')+'</div>';

  h+=`<article class="card"><div class="qhead"><span class="qnr">${cur.sec==='toets'?'Toetsvraag':'Opdracht'} ${cur.i+1} van ${L.length}</span><span class="et">🎯 Eindterm: ${q.et||MODS[cur.mod].et}</span></div>`;
  if(q.context) h+=`<div class="context lines">${lines(q.context)}</div>`;
  h+=`<div class="qtext lines">${lines(q.text)}</div>`;
  if(q.tabRows) h+=tabelRows(q.tabRows);
  if(q.tabel) h+=tabelHTML(q.tabel.xs,q.tabel.f,q.tabel.lx,q.tabel.ly);
  if(q.cfg){ const gr=svgGraph(q.cfg,exFor(q,s)); h+= q.cfg2?`<div class="duo">${gr}${svgGraph(q.cfg2,{})}</div>`:gr; if(!q.noLegend) h+=legend(q.cfg); }

  h+='<div class="antwoord">';
  const dis = s.done?'disabled':'';
  const enter = `onkeydown="if(event.key==='Enter')check()"`;
  if(q.type==='read'){
    const cx = s.done?'g':(s.mark&&s.mark.x||''), cy = s.done?'g':(s.mark&&s.mark.y||'');
    h+=`<div class="coord"><span class="haak">(</span><label><input class="ant ${cx}" id="ix" value="${esc(s.inp.x)}" oninput="saveInp('x',this.value)" ${enter} ${dis} aria-label="x"><small>x</small></label><span class="haak">,</span><label><input class="ant ${cy}" id="iy" value="${esc(s.inp.y)}" oninput="saveInp('y',this.value)" ${enter} ${dis} aria-label="y"><small>y</small></label><span class="haak">)</span></div>`;
  } else if(q.type==='num'){
    h+=`<div class="numrij">${q.lbl||'Antwoord:'} <input class="ant ${s.done?'g':''}" id="in1" value="${esc(s.inp.a)}" oninput="saveInp('a',this.value)" ${enter} ${dis}> ${q.unit||''}</div>`;
  } else if(q.type==='mc'){
    h+=`<div class="opts">${q.opts.map((o,i)=>{
      let cl=''; if(s.done&&i===q.ans) cl='g'; else if(s.wrong.includes(i)) cl='f'; else if(s.shown&&i===q.ans) cl='hint';
      return `<button class="opt ${cl}" onclick="choose(${i})" ${s.done||s.wrong.includes(i)?'disabled':''}>${o}</button>`;
    }).join('')}</div>`;
  } else if(q.type==='table'){
    h+=`<table class="tab"><tr><th>${q.lx||'x'}</th>${q.xs.map(x=>`<td>${x}</td>`).join('')}</tr><tr><th>${q.ly||'y'}</th>${q.xs.map((x,i)=>{
      const cl = s.done?'g':(s.cells?s.cells[i]:'');
      return `<td><input class="ant small ${cl}" id="t${i}" value="${esc(s.inp['t'+i])}" oninput="saveInp('t${i}',this.value)" ${enter} ${dis} aria-label="y bij x = ${x}"></td>`;
    }).join('')}</tr></table>`;
  } else if(q.type==='color'){
    if(!s.done) h+=`<div class="tip lines">${lines([`Klik op een stuk van de grafiek. Het wordt dan ${q.kleur}.`,'Klik nog een keer om de kleur weg te halen.'])}</div><button class="btn wis" onclick="wisSel()">🧽 Wis de kleuren</button>`;
  } else if(q.type==='plot'||q.type==='plotLine'){
    if(!s.done) h+=`<div class="tip lines">${lines(['Klik op een kruispunt van de lijnen om een punt te zetten.','Klik nog een keer op het punt om het weg te halen.'])}</div><button class="btn wis" onclick="wis()">🧽 Wis alle punten</button>`;
  }
  h+='</div>';

  if(s.hint>0) h+=`<div class="box hintbox lines">${q.hints.slice(0,s.hint).map((t,i)=>`<b>💡 Hint ${i+1}</b>${lines([t])}`).join('')}</div>`;
  if(s.fb) h+=`<div class="box ${s.fb.k} lines">${lines(s.fb.l)}</div>`;
  if(s.shown && !s.done) h+=`<div class="box oplossing lines"><h3>🔍 Zo zit het</h3>${lines(q.explain)}</div>`;

  h+='<div class="knoppen">';
  h+=`<button class="btn hint" onclick="hint()" ${s.done||s.hint>=q.hints.length?'disabled':''}>💡 Hint${s.hint?` (${s.hint}/${q.hints.length})`:''}</button>`;
  if(q.type!=='mc') h+=`<button class="btn check" onclick="check()" ${dis}>✔ Controleer</button>`;
  if(!s.done) h+=`<button class="btn skip" onclick="skip()">Overslaan ⏭</button>`;
  h+='</div>';
  h+=`<div class="navknoppen"><button class="btn nav" onclick="prev()">← Vorige</button><button class="btn nav ${s.done?'glow':''}" onclick="next()">${nextLabel()} →</button></div>`;
  h+='</article>';
  return h;
}

function renderResult(){
  let tot=0,max=0,rows='',open=[];
  MODS.forEach((M,m)=>{
    const po=secPunten(m,'opdr'), pt=secPunten(m,'toets');
    const mo=M.opdr.length*2, mt=M.toets.length*2;
    tot+=po+pt; max+=mo+mt;
    rows+=`<tr><td><b>${m+1}. ${M.kort}</b></td><td>${po} / ${mo}</td><td>${pt} / ${mt}</td></tr>`;
    ['opdr','toets'].forEach(s=>qlist(m,s).forEach((_,i)=>{
      const t=S[key(m,s,i)];
      if(!t||!t.done) open.push(`<button class="linkbtn" onclick="go(${m},'${s}',${i})">Module ${m+1} · ${s==='opdr'?'opdracht':'toetsvraag'} ${i+1}</button>`);
    }));
  });
  const pct = max?Math.round(tot/max*100):0;
  const msg = pct>=80?['Wauw, wat goed!','Jij snapt grafieken echt.']:pct>=55?['Goed bezig!','Oefen de open vragen nog een keer.']:['Je bent goed op weg.','Kijk de uitleg nog eens en probeer de open vragen.'];
  let h=`<article class="card"><h2>⭐ Mijn punten</h2><div class="lines">${lines(msg)}</div>`;
  h+=`<p style="font-size:1.4rem;font-weight:800;color:var(--roze)">${tot} van ${max} punten</p>`;
  h+=`<table class="res"><tr><th>Module</th><th>Opdrachten</th><th>Mini-toets</th></tr>${rows}</table>`;
  h+=`<div class="box info lines">${lines(['2 punten: in één keer goed.','1 punt: goed met een hint of na verbeteren.'])}</div>`;
  if(open.length) h+=`<h3 style="margin-top:14px">Nog niet af (${open.length}):</h3><div>${open.join(' · ')}</div>`;
  h+=`<button class="btn skip" style="margin-top:18px" onclick="opnieuw()">↺ Alles opnieuw beginnen</button></article>`;
  return h;
}

/* ============ INTERACTIE ============ */
function afterRender(){
  const q = (cur.sec==='opdr'||cur.sec==='toets') ? curQ() : null;
  if(!q) return;
  const s=st(key()); if(s.done) return;
  if(q.type==='color'){
    document.querySelectorAll('svg.graph .hit').forEach(el=>el.addEventListener('click',()=>toggleSeg(+el.getAttribute('data-seg'))));
    return;
  }
  if(q.type!=='plot'&&q.type!=='plotLine') return;
  const svg=document.querySelector('svg.graph.klik'); if(!svg) return;
  const ghost=svg.querySelector('.ghost'); const c=q.cfg, g=geom(c);
  const sx=c.snapX||g.xs, sy=c.snapY||g.ys;
  function toGrid(e){
    const pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY;
    const p=pt.matrixTransform(svg.getScreenCTM().inverse());
    const rx=c.xmin+(p.x-g.X(c.xmin))/g.cw*g.xs, ry=c.ymax-(p.y-g.Y(c.ymax))/g.ch*g.ys;
    const gx=+(Math.round(rx/sx)*sx).toFixed(4), gy=+(Math.round(ry/sy)*sy).toFixed(4);
    if(gx<c.xmin-1e-9||gx>c.xmax+1e-9||gy<c.ymin-1e-9||gy>c.ymax+1e-9) return null;
    return {x:gx,y:gy};
  }
  svg.addEventListener('mousemove',e=>{ const p=toGrid(e); if(p){ghost.setAttribute('cx',g.X(p.x));ghost.setAttribute('cy',g.Y(p.y));} else {ghost.setAttribute('cx',-50);} });
  svg.addEventListener('mouseleave',()=>ghost.setAttribute('cx',-50));
  svg.addEventListener('click',e=>{ const p=toGrid(e); if(p) toggle(p.x,p.y); });
}
function toggleSeg(i){ const s=st(key()); if(s.done) return; s.sel=s.sel||[]; const k=s.sel.indexOf(i); if(k>=0) s.sel.splice(k,1); else s.sel.push(i); render(); }
function wisSel(){ const s=st(key()); if(!s.done){ s.sel=[]; render(); } }
function toggle(x,y){
  const s=st(key()); if(s.done) return;
  const i=s.placed.findIndex(p=>p.x===x&&p.y===y);
  if(i>=0) s.placed.splice(i,1); else s.placed.push({x,y});
  render();
}
function wis(){ const s=st(key()); if(!s.done){ s.placed=[]; render(); } }
function saveInp(k,v){ st(key()).inp[k]=v; }
function hint(){ const q=curQ(), s=st(key()); if(s.done) return; s.hint=Math.min(s.hint+1,q.hints.length); render(); }
function skip(){ const s=st(key()); if(!s.done) s.skipped=true; next(); }
function maxTries(q){ return q.type==='mc' ? Math.min(4,q.opts.length-1) : 4; }

function result(ok,tip){
  const q=curQ(), s=st(key());
  if(ok){
    s.done=true; s.skipped=false;
    s.pts=(s.tries===0&&s.hint===0)?2:1;
    s.fb={k:'good',l:[pick(LOF), s.pts===2?'In één keer goed: je krijgt 2 punten!':'Je krijgt 1 punt.'].concat(q.praise||[])};
  } else {
    s.tries++;
    if(s.tries>=maxTries(q) && !s.shown){
      s.shown=true;
      s.fb={k:'bad',l:['Dit is lastig, dat is niet erg!'].concat(tip,['Kijk naar de uitleg hieronder.','In het groen zie je precies hoe het goede antwoord eruitziet.','Probeer het daarna nog een keer.'])};
    } else if(s.shown){
      s.fb={k:'bad',l:['Nog niet goed.'].concat(tip,['Kijk goed naar de groene hulp en de uitleg.'])};
    } else {
      s.fb={k:'bad',l:['Nog niet goed.'].concat(tip,['Probeer het nog een keer.','Je kunt ook een hint gebruiken.'])};
    }
  }
  render();
}
function info(t){ st(key()).fb={k:'info',l:t}; render(); }

function check(){
  const q=curQ(), s=st(key()); if(s.done) return;
  if(q.type==='read'){
    const x=num(s.inp.x), y=num(s.inp.y);
    if(isNaN(x)||isNaN(y)) return info(['Vul bij x én bij y een getal in.']);
    const ok = x===q.ans.x && y===q.ans.y;
    s.mark={x:x===q.ans.x?'g':'f', y:y===q.ans.y?'g':'f'};
    let tip=[];
    if(!ok){
      if(x===q.ans.y && y===q.ans.x) tip=['Let op: je hebt x en y omgedraaid.','Eerst x (links of rechts), dan y (omhoog of omlaag).'];
      else if(x===q.ans.x) tip=['Je x is goed!','Kijk nog eens naar y.','Ligt het punt boven of onder de x-as?'];
      else if(y===q.ans.y) tip=['Je y is goed!','Kijk nog eens naar x.','Ligt het punt links of rechts van de y-as?'];
      else if(x===-q.ans.x || y===-q.ans.y) tip=['Kijk goed naar de min (-).','Links en omlaag krijgen een min.'];
    }
    return result(ok,tip);
  }
  if(q.type==='num'){
    const a=num(s.inp.a);
    if(isNaN(a)) return info(['Vul eerst een getal in.']);
    let tip=[];
    if(a!==q.ans && a===-q.ans) tip=['Bijna!','Kijk goed naar de min (-).','Is de uitkomst boven of onder de 0?'];
    return result(a===q.ans,tip);
  }
  if(q.type==='table'){
    const vals=q.xs.map((x,i)=>num(s.inp['t'+i]));
    if(vals.some(isNaN)) return info(['Vul alle vakjes in de tabel in.']);
    s.cells=q.xs.map((x,i)=>vals[i]===q.f(x)?'g':'f');
    const goed=s.cells.filter(c=>c==='g').length;
    return result(goed===q.xs.length,[`${goed} van de ${q.xs.length} vakjes zijn goed.`,'De rode vakjes kloppen nog niet.']);
  }
  if(q.type==='plot'){
    const T=q.targets, P=s.placed;
    if(P.length===0) return info(['Je hebt nog geen punt gezet.','Klik in het assenstelsel om een punt te zetten.']);
    const ok = P.length===T.length && T.every(t=>has(P,t,q.tol));
    let tip=[];
    if(!ok){
      if(T.length===1 && P.length===1){
        const p=P[0], t=T[0];
        if(p.x===t.y&&p.y===t.x) tip=['Let op: je hebt x en y omgedraaid.','Eerst x (opzij), dan y (omhoog of omlaag).'];
        else if(p.x===t.x) tip=['Je bent goed opzij gegaan.','Kijk nog eens naar omhoog of omlaag (y).'];
        else if(p.y===t.y) tip=['Je bent goed omhoog of omlaag gegaan.','Kijk nog eens naar links of rechts (x).'];
        else tip=['Je punt staat op de verkeerde plek.','Begin opnieuw in de oorsprong (0, 0).'];
      } else if(P.length!==T.length){
        tip=[`Je hebt ${P.length} ${P.length===1?'punt':'punten'} gezet.`,`Er moeten ${T.length} punten komen.`];
      } else {
        tip=[`${T.filter(t=>has(P,t,q.tol)).length} van de ${T.length} punten staan goed.`];
      }
    }
    return result(ok,tip);
  }
  if(q.type==='color'){
    const sel=s.sel||[];
    if(!sel.length) return info(['Je hebt nog niets gekleurd.','Klik op een stuk van de grafiek.']);
    const T=q.target, fout=sel.filter(i=>!T.includes(i)).length, mist=T.filter(t=>!sel.includes(t)).length;
    let tip=[];
    if(fout) tip.push(fout===1?'Eén gekleurd stuk klopt niet.':`${fout} gekleurde stukken kloppen niet.`);
    if(mist) tip.push(mist===1?'Je mist nog één stuk.':`Je mist nog ${mist} stukken.`);
    return result(!fout&&!mist,tip);
  }
  if(q.type==='plotLine'){
    const P=s.placed;
    if(P.length===0) return info(['Je hebt nog geen punt gezet.','Klik in het assenstelsel om een punt te zetten.']);
    const on=p=>Math.abs(q.f(p.x)-p.y)<1e-9;
    const goed=P.filter(on).length, fout=P.length-goed;
    let tip=[];
    if(fout>0) tip.push(`${fout} ${fout===1?'punt ligt':'punten liggen'} niet op de grafiek.`);
    if(goed<q.min) tip.push(`Je hebt ${goed} goede ${goed===1?'punt':'punten'}.`,`Je hebt er minstens ${q.min} nodig.`);
    return result(fout===0&&goed>=q.min,tip);
  }
}
function choose(i){
  const q=curQ(), s=st(key()); if(s.done||s.wrong.includes(i)) return;
  if(i===q.ans) return result(true,[]);
  s.wrong.push(i);
  result(false,[`"${q.opts[i]}" is niet goed.`]);
}

/* ============ NAVIGATIE ============ */
function go(m,s,i){ cur={mod:m,sec:s,i:i}; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function nextLabel(){
  const L=qlist();
  if(cur.i<L.length-1) return 'Volgende';
  if(cur.sec==='opdr') return 'Naar de mini-toets';
  if(cur.mod<MODS.length-1) return `Naar module ${cur.mod+2}`;
  return 'Bekijk je punten';
}
function next(){
  const L=qlist();
  if(cur.i<L.length-1) go(cur.mod,cur.sec,cur.i+1);
  else if(cur.sec==='opdr') go(cur.mod,'toets',0);
  else if(cur.mod<MODS.length-1) go(cur.mod+1,'uitleg',0);
  else go(cur.mod,'result',0);
}
function prev(){
  if(cur.i>0) go(cur.mod,cur.sec,cur.i-1);
  else if(cur.sec==='toets') go(cur.mod,'opdr',MODS[cur.mod].opdr.length-1);
  else if(cur.sec==='opdr') go(cur.mod,'uitleg',0);
}
function updateScore(){
  document.getElementById('score').textContent=`⭐ ${totaalPunten()} punten`;
}
function opnieuw(){
  if(!confirm('Weet je het zeker? Al je punten worden gewist.')) return;
  S={}; go(0,'uitleg',0);
}

if(ONLINE){
  let ses=null; try{ ses=JSON.parse(sessionStorage.getItem(SESSIE)||'null'); }catch(e){}
  if(ses && ses.klascode){ aanmelden(ses.klascode, ses.naam, ses.pin, true); } else render();
} else render();
</script>
